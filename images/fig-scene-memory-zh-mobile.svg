<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
<title>每次對話從零開始，靠檔案記憶接續</title>
<desc>示意圖：一排空白的日曆頁代表每次對話都從零開始；攤開的筆記本與正在閱讀它的龍蝦造型小機器人，代表靠寫進檔案的記憶接續。</desc>
<rect width="480" height="640" fill="#f9f7f4"/>
<text x="240" y="44" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">每次對話都從零開始</text>
<rect x="60" y="70" width="90" height="100" rx="6" fill="#fff" stroke="#d8d2c8" stroke-width="2"/><rect x="60" y="70" width="90" height="18" rx="6" fill="#c2412f"/>
<rect x="178" y="70" width="90" height="100" rx="6" fill="#fff" stroke="#d8d2c8" stroke-width="2"/><rect x="178" y="70" width="90" height="18" rx="6" fill="#c2412f"/>
<rect x="296" y="70" width="90" height="100" rx="6" fill="#fff" stroke="#d8d2c8" stroke-width="2"/><rect x="296" y="70" width="90" height="18" rx="6" fill="#c2412f"/>
<text x="240" y="270" font-size="26" fill="#2f6f73" text-anchor="middle" font-weight="700">靠寫進檔案的記憶接續</text>
<rect x="120" y="310" width="120" height="130" rx="8" fill="#fff" stroke="#2b2a28" stroke-width="3"/><rect x="240" y="310" width="120" height="130" rx="8" fill="#fff" stroke="#2b2a28" stroke-width="3"/><line x1="134" y1="334" x2="228" y2="334" stroke="#d8d2c8" stroke-width="3"/><line x1="252" y1="334" x2="346" y2="334" stroke="#d8d2c8" stroke-width="3"/><line x1="134" y1="354" x2="228" y2="354" stroke="#d8d2c8" stroke-width="3"/><line x1="252" y1="354" x2="346" y2="354" stroke="#d8d2c8" stroke-width="3"/><line x1="134" y1="374" x2="228" y2="374" stroke="#d8d2c8" stroke-width="3"/><line x1="252" y1="374" x2="346" y2="374" stroke="#d8d2c8" stroke-width="3"/><line x1="134" y1="394" x2="228" y2="394" stroke="#d8d2c8" stroke-width="3"/><line x1="252" y1="394" x2="346" y2="394" stroke="#d8d2c8" stroke-width="3"/>
<g transform="translate(240 560) scale(0.95 0.95)"><path d="M-14 -54 Q-30 -92 -48 -86 M14 -54 Q30 -92 48 -86" stroke="#c2412f" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="36" rx="34" ry="30" fill="#c2412f"/><circle cx="-50" cy="34" r="13" fill="#a8341f"/><circle cx="50" cy="34" r="13" fill="#a8341f"/><rect x="-38" y="-58" width="76" height="64" rx="26" fill="#c2412f"/><rect x="-28" y="-46" width="56" height="36" rx="15" fill="#2b2a28"/><circle cx="-12" cy="-28" r="5" fill="#ffd9a0"/><circle cx="12" cy="-28" r="5" fill="#ffd9a0"/></g>
</svg>
