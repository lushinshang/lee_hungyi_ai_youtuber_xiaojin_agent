<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 530" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
<title>同一個靈魂，不同的身體</title>
<desc>小金的設定檔與記憶是同一份「靈魂」，可以分別放在 OpenClaw、Claude Code、Cowork 這些不同的 Harness 上，各自接不同的語言模型。</desc>
<rect width="480" height="530" fill="#f9f7f4"/>
<rect x="20" y="20" width="440" height="90" rx="10" fill="#efe9de" stroke="#c2412f" stroke-width="2"/><text font-size="24" fill="#c2412f" font-weight="700"><tspan text-anchor="middle" x="240.0" y="56.9">同一個靈魂：</tspan><tspan text-anchor="middle" x="240.0" y="89.9">同一份設定檔與記憶</tspan></text>
<path d="M240 110 L240 170 " stroke="#c2412f" stroke-width="3" opacity=".0"/>
<path d="M40 110 L40 200 L90 200" stroke="#c2412f" stroke-width="3" fill="none"/>
<rect x="90" y="170" width="330" height="60" rx="10" fill="#fff" stroke="#2f6f73" stroke-width="2"/><text font-size="24" fill="#1a1a1a" font-weight="700"><tspan text-anchor="middle" x="255.0" y="208.4">OpenClaw</tspan></text>
<path d="M240 110 L240 260 " stroke="#c2412f" stroke-width="3" opacity=".0"/>
<path d="M40 110 L40 290 L90 290" stroke="#c2412f" stroke-width="3" fill="none"/>
<rect x="90" y="260" width="330" height="60" rx="10" fill="#fff" stroke="#2f6f73" stroke-width="2"/><text font-size="24" fill="#1a1a1a" font-weight="700"><tspan text-anchor="middle" x="255.0" y="298.4">Claude Code</tspan></text>
<path d="M240 110 L240 350 " stroke="#c2412f" stroke-width="3" opacity=".0"/>
<path d="M40 110 L40 380 L90 380" stroke="#c2412f" stroke-width="3" fill="none"/>
<rect x="90" y="350" width="330" height="60" rx="10" fill="#fff" stroke="#2f6f73" stroke-width="2"/><text font-size="24" fill="#1a1a1a" font-weight="700"><tspan text-anchor="middle" x="255.0" y="388.4">Cowork</tspan></text>
<text font-size="22" fill="#5c5650" font-weight="400"><tspan x="20" y="478">各自接語言模型，</tspan><tspan x="20" y="508">各有不同的身體</tspan></text>
</svg>
