<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
<title>同一個靈魂，不同的身體</title>
<desc>小金的設定檔與記憶是同一份「靈魂」，可以分別放在 OpenClaw、Claude Code、Cowork 這些不同的 Harness 上，各自接不同的語言模型。</desc>
<rect width="800" height="330" fill="#f9f7f4"/>
<rect x="150" y="24" width="500" height="70" rx="10" fill="#efe9de" stroke="#c2412f" stroke-width="2"/><text font-size="20" fill="#c2412f" font-weight="700"><tspan text-anchor="middle" x="400.0" y="66.0">同一個靈魂：同一份設定檔與記憶</tspan></text>
<path d="M400 94 L150 170" stroke="#c2412f" stroke-width="3"/>
<rect x="40" y="170" width="220" height="70" rx="10" fill="#fff" stroke="#2f6f73" stroke-width="2"/><text font-size="22" fill="#1a1a1a" font-weight="700"><tspan text-anchor="middle" x="150.0" y="212.7">OpenClaw</tspan></text>
<path d="M400 94 L400 170" stroke="#c2412f" stroke-width="3"/>
<rect x="290" y="170" width="220" height="70" rx="10" fill="#fff" stroke="#2f6f73" stroke-width="2"/><text font-size="22" fill="#1a1a1a" font-weight="700"><tspan text-anchor="middle" x="400.0" y="212.7">Claude Code</tspan></text>
<path d="M400 94 L650 170" stroke="#c2412f" stroke-width="3"/>
<rect x="540" y="170" width="220" height="70" rx="10" fill="#fff" stroke="#2f6f73" stroke-width="2"/><text font-size="22" fill="#1a1a1a" font-weight="700"><tspan text-anchor="middle" x="650.0" y="212.7">Cowork</tspan></text>
<text x="400" y="292" font-size="19" fill="#5c5650" text-anchor="middle" font-weight="400">各自接語言模型，各有不同的身體</text>
</svg>
