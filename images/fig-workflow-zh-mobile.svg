<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 604" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
<title>小金每天的工作流程</title>
<desc>由上而下五步：每天中午提一個影片構想；講者給一點建議；小金自己找資料、寫講稿、語音合成配音、做影片；先傳給講者看；講者說可以，才上傳 YouTube。</desc>
<rect width="480" height="604" fill="#f9f7f4"/>
<rect x="20" y="20" width="440" height="96" rx="10" fill="#fff" stroke="#c2412f" stroke-width="2"/><text font-size="24" fill="#1a1a1a" font-weight="400"><tspan text-anchor="middle" x="240.0" y="59.9">每天中午</tspan><tspan text-anchor="middle" x="240.0" y="92.9">提一個影片構想</tspan></text>
<path d="M240 116 L240 142" stroke="#1a1a1a" stroke-width="3"/><path d="M232 136 L240 150 L248 136" fill="#1a1a1a"/>
<rect x="20" y="150" width="440" height="70" rx="10" fill="#fff" stroke="#2f6f73" stroke-width="2"/><text font-size="24" fill="#1a1a1a" font-weight="400"><tspan text-anchor="middle" x="240.0" y="193.4">你給一點建議</tspan></text>
<path d="M240 220 L240 246" stroke="#1a1a1a" stroke-width="3"/><path d="M232 240 L240 254 L248 240" fill="#1a1a1a"/>
<rect x="20" y="254" width="440" height="96" rx="10" fill="#fff" stroke="#c2412f" stroke-width="2"/><text font-size="24" fill="#1a1a1a" font-weight="400"><tspan text-anchor="middle" x="240.0" y="293.9">自己找資料、寫講稿、</tspan><tspan text-anchor="middle" x="240.0" y="326.9">語音合成配音、做影片</tspan></text>
<path d="M240 350 L240 376" stroke="#1a1a1a" stroke-width="3"/><path d="M232 370 L240 384 L248 370" fill="#1a1a1a"/>
<rect x="20" y="384" width="440" height="70" rx="10" fill="#fff" stroke="#2f6f73" stroke-width="2"/><text font-size="24" fill="#1a1a1a" font-weight="400"><tspan text-anchor="middle" x="240.0" y="427.4">先傳給你看</tspan></text>
<path d="M240 454 L240 480" stroke="#1a1a1a" stroke-width="3"/><path d="M232 474 L240 488 L248 474" fill="#1a1a1a"/>
<rect x="20" y="488" width="440" height="96" rx="10" fill="#fff" stroke="#2f6f73" stroke-width="2"/><text font-size="24" fill="#1a1a1a" font-weight="700"><tspan text-anchor="middle" x="240.0" y="527.9">你說可以，</tspan><tspan text-anchor="middle" x="240.0" y="560.9">才上傳 YouTube</tspan></text>
</svg>
